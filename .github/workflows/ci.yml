name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version || true

      - name: Lint shell scripts
        run: bash -n scripts/*.sh

      - name: Style hygiene
        run: bash scripts/check_style.sh

      - name: Guard against committed signing material
        run: bash scripts/check_no_signing_material.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

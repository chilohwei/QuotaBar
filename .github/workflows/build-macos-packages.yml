name: Build macOS Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (for example 1.2.3)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
          - universal
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -z "$version" ]]; then
            version="0.0.0-${GITHUB_RUN_NUMBER}"
          fi

          build_number="$(date -u +%Y%m%d%H%M)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/release_version.sh check "$version" --exclude-version "$version"
          elif [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            scripts/release_version.sh check "$version"
          else
            echo "Skipping release version validation for non-release build version: $version"
          fi

      - name: Check script syntax
        shell: bash
        run: bash -n scripts/*.sh

      - name: Run tests
        shell: bash
        run: swift test

      # Signing + notarization self-activate ONLY when the MACOS_SIGNING_IDENTITY secret is set.
      # Without it every step below falls back to the existing ad-hoc build, so this workflow is
      # safe to run before any Apple credentials are configured.
      - name: Detect signing availability
        id: signing
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization ENABLED for this run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No MACOS_SIGNING_IDENTITY secret: building ad-hoc (unsigned, not notarized)."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/quotabar-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          CERT_FILE="$RUNNER_TEMP/quotabar-cert.p12"
          # Remove the decoded .p12 even if `security import` fails and set -e exits the step.
          trap 'rm -f "$CERT_FILE"' EXIT
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_FILE"
          # Without set-key-partition-list, codesign fails with errSecInternalComponent /
          # "User interaction is not allowed" on the headless runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Keep login.keychain-db in the search list so runner tooling still works.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build DMG
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZE: ${{ steps.signing.outputs.enabled }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          skip_check=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            skip_check=true
          fi
          BUILD_NUMBER="${{ steps.meta.outputs.build_number }}" \
          QUOTABAR_SKIP_REMOTE_VERSION_CHECK="$skip_check" \
          QUOTABAR_SKIP_DMG_LAYOUT=false \
          QUOTABAR_REQUIRE_DMG_LAYOUT=true \
          bash scripts/build_macos_app.sh \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.meta.outputs.version }}"

      - name: Inspect build outputs
        shell: bash
        run: |
          ls -la dist
          ls -la dist/releases
          codesign --verify --deep --strict --verbose=2 "dist/QuotaBar-${{ matrix.arch }}.app"
          test -s "dist/releases/QuotaBar-${{ steps.meta.outputs.version }}-${{ matrix.arch }}.dmg.sha256"

      - name: Verify signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/QuotaBar-${{ matrix.arch }}.app"
          DMG="dist/releases/QuotaBar-${{ steps.meta.outputs.version }}-${{ matrix.arch }}.dmg"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier="
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: quotabar-${{ matrix.arch }}
          path: |
            dist/releases/*-${{ matrix.arch }}.dmg
            dist/releases/*-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/releases
          pattern: quotabar-*
          merge-multiple: true

      - name: Create release and upload DMG files
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/releases/*.dmg
            dist/releases/*.dmg.sha256

      - name: Update Homebrew cask from released asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/update_homebrew_cask.sh "$version"
          bash scripts/verify_homebrew_cask.sh "$version" --skip-brew

      - name: Sync standalone Homebrew tap
        shell: bash
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/sync_homebrew_tap.sh "$version"

      # The tap is the user-facing source of truth; keep the in-repo cask aligned with it
      # so the two can never drift apart (a stale in-repo checksum once shipped a mismatch).
      - name: Commit cask update back to main
        shell: bash
        run: |
          set -euo pipefail
          cp Casks/quotabar.rb /tmp/quotabar-cask.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/quotabar-cask.rb Casks/quotabar.rb
          if git diff --quiet -- Casks/quotabar.rb; then
            echo "Cask on main already matches the released asset."
            exit 0
          fi
          git add Casks/quotabar.rb
          git commit -m "Update cask for v${GITHUB_REF_NAME#v}"
          git push origin main || {
            git fetch origin main
            git rebase origin/main
            git push origin main
          }
